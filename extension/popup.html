<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="popup.css" />
  <title>Bulk Unsubscribe</title>
</head>
<body>
  <div class="popup-card">
    <header class="header">
      <div class="header-left">
        <div class="brand-icon-wrap" aria-hidden="true">
          <img src="icons/icon-source.png" alt="" class="brand-icon" />
        </div>
        <h1 class="title">Bulk Unsubscribe</h1>
      </div>

      <button id="help" class="icon-circle icon-help" type="button" aria-label="Help">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7" />
          <path d="M9.8 9.2a2.45 2.45 0 1 1 3.45 2.24c-.82.43-1.25.83-1.25 1.72v.25" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="12" cy="16.75" r=".9" fill="currentColor" />
        </svg>
      </button>
    </header>

    <div class="rule"></div>

    <section id="statusBar" class="status-row" data-tone="danger" aria-live="polite">
      <div class="status-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <rect x="3.5" y="5.3" width="17" height="13.4" rx="2.15" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="m4.5 7.1 7.05 5.05a.8.8 0 0 0 .9 0L19.5 7.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <p id="status" class="status-text">Open Gmail to use this.</p>
    </section>

    <div class="rule"></div>

    <main class="content">
      <section class="copy">
        <h2 class="section-title">Protect senders</h2>
        <p class="section-subtitle">One per line. Use email substrings.</p>
      </section>

      <section class="keep">
        <label for="keeplist" class="sr-only">Protected senders</label>
        <textarea id="keeplist" class="keep-textarea" rows="4" spellcheck="false">security
receipt
instagram.com
github.com</textarea>
        <p class="hint">Any sender whose email contains one of these is skipped.</p>
      </section>

      <section class="actions">
        <button id="preview" class="btn btn-outline" type="button">
          <span class="btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M2.5 12s3.7-6 9.5-6 9.5 6 9.5 6-3.7 6-9.5 6-9.5-6-9.5-6Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="12" cy="12" r="3.05" fill="none" stroke="currentColor" stroke-width="1.8" />
            </svg>
          </span>
          <span>Preview senders</span>
        </button>

        <button id="run" class="btn btn-primary" type="button" disabled>
          <span class="btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M20 13V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              <path d="m20 8-6.6 4.45a2.15 2.15 0 0 1-2.4 0L4 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              <path d="m16.7 15.3 4.6 4.6M21.3 15.3l-4.6 4.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </span>
          <span>Unsubscribe all</span>
        </button>

        <button id="stop" class="btn btn-stop" type="button" disabled>
          <span class="btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="5.2" y="5.2" width="13.6" height="13.6" rx="2.8" fill="none" stroke="currentColor" stroke-width="1.8" />
            </svg>
          </span>
          <span>Stop</span>
        </button>
      </section>

      <section id="resultsPanel" class="results is-hidden" aria-live="polite">
        <div id="summary" class="summary"></div>
        <ol id="lines" class="lines"></ol>
      </section>
    </main>

    <div class="rule"></div>

    <footer class="footer">
      <div class="footer-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 3.8 18.7 6v5.45c0 4.35-2.7 7.15-6.7 8.65-4-1.5-6.7-4.3-6.7-8.65V6L12 3.8Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
          <path d="m9.5 12.1 1.55 1.55 3.45-3.75" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <span class="footer-text">Private by default. Runs entirely in your browser.</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
