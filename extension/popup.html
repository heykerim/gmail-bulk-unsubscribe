<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="popup.css" />
  <title>Bulk Unsubscribe</title>
</head>
<body>
  <div class="popup-card">
    <header class="header">
      <div class="header-left">
        <div class="brand-icon-wrap" aria-hidden="true">
          <img src="icons/icon-source.png" alt="" class="brand-icon" />
        </div>
        <h1 class="title">Bulk Unsubscribe</h1>
      </div>

      <button id="githubLink" class="icon-circle icon-github" type="button" aria-label="Open GitHub repository" title="Open GitHub repository">
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAeCAYAAAA7MK6iAAADF0lEQVR42sWWO2gVURCGv9278RFMYdQQlPggFhFEQoytWIgRHwiCTZqohGChtY2NIEjAQrHyhRiFREQECUjAxkobYxEUFRXRwkdAuDFo4n2szT8yHHdvbmLhgcPunT3z/2fmzisifxWAit6bgd3aXUAb0ASkwHfgA/AUeACMAcUMjDlXBMR6Xw2cFXBa534HnAZaHHlUD6mtAWDSAVaAMlDVNnnVfas4+SfgsMONapFGQANw3QGUAqK5dlU69vuSszrKc28DMCqFX7KinENezZGVAr0UuCfyv9xe0HPIkWZZU3Lu9mTlwEq/DetawPXnZSCwNAWGgV7giiJ1Lou/AZelMyxZ2ZEfNU7zeyvwElimD6kutEcpArAR6AOeA2+BKcmbgPXAJuAm8F7y/cB9EVuWTAEdwFez+pxzZeqicweQAIuofy2WTk+AZdiDdnCFbuBdZ4f6dCbRrRPtgn7Hek+CMwDHAizD/wIsT4C9wCoJzSWxbvrRud4U660Fb4QRO3lVhWUfwIiLzNQ974ZROI9lOncCTMuIEYDXziJ/6KBumSyAOJHugQDTOF4BTAcpYs9Nzu3zXabTEWAaz3QMNGYoVpV7/7pKOXHRGOsGBAFQUG5H9XSWGnW/VVjVACeNXe9MnbW4PIwW6OpU/dtjGkcRYDxIdJ9vzQuIbAvGlRn1wTjGY+BxhsUl5duQy+mkRlOPXCEpq8vdcvUhCjieAOzMiDq/x4D2eVi8GXgUpFGYNbvQ7SacS86omo06hSJwUfK2jKliA3AIuAHM5JBWhP/C1/4jrq4+BLolHw6UZ/UtcrUaYFsw9lRyenkK9PsIbACeuUOfgSVqeaPAD33vyigqFkyngt7rt1k/IWtjH7GdsmhWh447l7YDS3MqmXWqzhrjkE0o3XlTSK9zVVGBV295XOsuXQ0m01R/Z2Zqmsv6neIscBs4qQa+JcNqTzyTM2meCDhyk78nZ4jvybi1Ea8DfgbRPKkuRz1dzkBbgAsa4Axoew3iNe7cjGbztvlWPn+wAzgPXNUwmNU4rHINaozdmoP1/9dvARhzyq+dgvoAAAAASUVORK5CYII=" alt="" class="github-mark" />
      </button>
    </header>

    <div class="rule"></div>

    <section id="statusBar" class="status-row" data-tone="danger" aria-live="polite">
      <div class="status-icon" aria-hidden="true">
        <svg data-lucide="mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="16" x="2" y="4" rx="2" />
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
        </svg>
      </div>
      <p id="status" class="status-text">Open Gmail to use this.</p>
    </section>

    <div class="rule"></div>

    <main class="content">
      <section class="copy">
        <h2 class="section-title">Protect senders</h2>
        <p class="section-subtitle">One per line. Use email substrings.</p>
      </section>

      <section class="keep">
        <label for="keeplist" class="sr-only">Protected senders</label>
        <textarea id="keeplist" class="keep-textarea" rows="4" spellcheck="false">security
receipt
instagram.com
github.com</textarea>
        <p class="hint">Any sender whose email contains one of these is skipped.</p>
      </section>

      <section class="actions">
        <button id="preview" class="btn btn-outline" type="button">
          <span class="btn-icon" aria-hidden="true">
            <svg data-lucide="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </span>
          <span>Preview senders</span>
        </button>

        <button id="run" class="btn btn-primary" type="button" disabled>
          <span class="btn-icon" aria-hidden="true">
            <svg data-lucide="mail-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 7 13.03 12.7a1.94 1.94 0 0 1-2.06 0L2 7" />
              <rect x="2" y="4" width="20" height="16" rx="2" />
              <path d="m17 17 4 4" />
              <path d="m21 17-4 4" />
            </svg>
          </span>
          <span>Unsubscribe all</span>
        </button>

        <button id="stop" class="btn btn-stop" type="button" disabled>
          <span class="btn-icon" aria-hidden="true">
            <svg data-lucide="square" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="2" />
            </svg>
          </span>
          <span>Stop</span>
        </button>
      </section>

      <section id="resultsPanel" class="results is-hidden" aria-live="polite">
        <div id="summary" class="summary"></div>
        <ol id="lines" class="lines"></ol>
      </section>
    </main>

    <div class="rule"></div>

    <footer class="footer">
      <div class="footer-icon" aria-hidden="true">
        <svg data-lucide="shield-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 13c0 5-3.5 7.5-8 8.5C7.5 20.5 4 18 4 13V6l8-3 8 3z" />
          <path d="m9 12 2 2 4-4" />
        </svg>
      </div>
      <span class="footer-text">Private by default. Runs entirely in your browser.</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
