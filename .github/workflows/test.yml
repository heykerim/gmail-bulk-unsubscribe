name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Run regression tests
        run: node --test tests/*.test.js

      - name: Check JavaScript syntax
        run: |
          node --check extension/content.js
          node --check extension/popup.js
          node --check unsubscribe.js
          node --check bulk-unsubscribe.user.js

      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('extension/manifest.json', 'utf8'))"

      - name: Validate PNG icon dimensions
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path

          expected = {
              'icon16.png': (16, 16),
              'icon32.png': (32, 32),
              'icon48.png': (48, 48),
              'icon128.png': (128, 128),
          }

          for name, size in expected.items():
              data = (Path('extension/icons') / name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'{name}: invalid PNG signature'
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) == size, f'{name}: expected {size}, got {(width, height)}'
              print(f'{name}: {width}x{height}')
          PY

      - name: Build Chrome Web Store package
        run: bash scripts/package-extension.sh

      - name: Validate Chrome Web Store package
        run: |
          test -f dist/gmail-bulk-unsubscribe-v1.0.0.zip
          unzip -Z1 dist/gmail-bulk-unsubscribe-v1.0.0.zip | grep -qx 'manifest.json'
          if unzip -Z1 dist/gmail-bulk-unsubscribe-v1.0.0.zip | grep -q '^extension/'; then
            echo 'Store archive must contain extension files at the archive root.' >&2
            exit 1
          fi

      - name: Upload Chrome Web Store package
        uses: actions/upload-artifact@v4
        with:
          name: gmail-bulk-unsubscribe-v1.0.0-store-package
          path: dist/gmail-bulk-unsubscribe-v1.0.0.zip
          if-no-files-found: error
